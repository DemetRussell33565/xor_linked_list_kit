[project]
name = "xor-linked-list-kit"
version = "0.1.0"
description = "Python implementation of a doubly linked list where each node stores one XOR-encoded link field instead of two pointers"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
